services:
  browser:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5900:5900"   # VNC
      - "6080:6080"   # noVNC web interface
      - "9222:9223"   # Chrome DevTools Protocol (socat forwards 9223->9222)
    environment:
      - RESOLUTION=1280x720x24
    shm_size: '2gb'
    restart: unless-stopped
