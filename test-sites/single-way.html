<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Way Navigation</title>
</head>
<body>
    <header>
        <h1>My Website</h1>
        <!-- Only one navigation method: A simple list of links, but not in a <nav> and no search -->
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </header>
    <main>
        <h2>Welcome</h2>
        <p>This page has only one way to navigate to other pages (the list above). It lacks a search bar, a sitemap, or a proper &lt;nav&gt; landmark that might be counted as a primary navigation mechanism.</p>
        <p>This should fail WCAG 2.4.5 Multiple Ways.</p>
    </main>
</body>
</html>
