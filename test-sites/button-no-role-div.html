<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Div Button Test</title>
</head>

<body>
  <h1>Test Case: Div Button</h1>
  <!-- Violation: Interactive element (onclick) but no role="button" or tabindex -->
  <!-- Note: The current Evaluator checks for "Interactive element with role... has no name". 
         A div with onclick might not even show up as a "button" in AXTree unless we are smart.
         However, if we give it role="button" but no name, it triggers our specific rule.
         Let's stick to the rule we implemented: "Interactive element with role... has no name"
    -->
  <div role="button" onclick="alert('clicked')"></div>
</body>
